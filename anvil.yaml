metadata:
  description: "Free AI engineering training and certification: context engineering, production RAG, agents, evals, security and LLMOps, with drills, labs and real incident files."
  logo_img: "asset:icon-512.png"
  title: "AI Expert: free AI engineering training and certificates"
name: AI Expert
native_deps:
  head_html: |
    <script src="_/theme/legal-kit.js?v=4c721fe73e"></script>
    <!-- seo:start (APP_MAKER/seo: edit seo/apps/aiexpert.json and run seo.py, not here) -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
    <meta name="keywords" content="AI engineer course free, AI engineering certification, production RAG tutorial, hybrid search reranking, LLM evaluation course, context engineering, AI agents course, prompt injection security, LLMOps training, AI engineer roadmap">
    <meta name="author" content="Arkvital">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="AI Expert">
    <meta property="og:title" content="AI Expert: free AI engineering training and certificates">
    <meta property="og:description" content="Free AI engineering training and certification: context engineering, production RAG, agents, evals, security and LLMOps, with drills, labs and real incident files.">
    <meta property="og:locale" content="en_CA">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="AI Expert: free AI engineering training and certificates">
    <meta name="twitter:description" content="Free AI engineering training and certification: context engineering, production RAG, agents, evals, security and LLMOps, with drills, labs and real incident files.">
    <!-- seo:end -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f6f7f9">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
    <link id="ui-favicon" rel="icon" type="image/svg+xml" href="_/theme/icon.svg?v=4662880080">
    <link rel="apple-touch-icon" href="_/theme/icon-180.png?v=40b10e7508">
    <script>
    /* Keep our tab icon: Anvil adds its own <link rel="icon">, so drop any other icon link. */
    (function () {
      function keep() {
        var ours = document.getElementById('ui-favicon');
        if (!ours) return;
        document.querySelectorAll('link[rel~="icon"]').forEach(function (l) { if (l !== ours) l.remove(); });
      }
      keep();
      document.addEventListener('DOMContentLoaded', keep);
      window.addEventListener('load', keep);
    })();
    </script>

    <!-- Prepsto feedback panel: every "Submit feedback" link and button opens it (it is the only feedback channel). No floating button, no cookies, nothing loads until it is opened. Codes: APP_MAKER/prepsto-links.json -->
    <script src="https://prepsto.com/_/theme/widget.js" data-prepsto="__PREPSTO_CODE__" data-button="false" data-label="Submit feedback" async></script>
    <link rel="stylesheet" href="_/theme/icons.css?v=2f48104c97">
    <link rel="stylesheet" href="_/theme/app.css?v=7f522aee61">
    <script src="_/theme/app-kit.js?v=59b3051c04"></script>
    <script src="_/theme/ax-kit.js?v=f900987903"></script>
    <script src="_/theme/ax-labs.js?v=e9da6c41bc"></script>
package_name: AI_Expert
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
    use_google: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
- client_config: {}
  server_config: {}
  source: /runtime/services/google.yml
startup:
  module: startup
  type: module
